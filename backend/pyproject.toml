[project]
name = "evalx-backend"
version = "0.1.0"
description = "Backend API and evaluation engine for EVALX"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "clerk-backend-api>=1.0.0",
    "deepeval>=4.2.3",
    "fastapi>=0.141.1",
    "langfuse>=4.15.4",
    "litellm>=1.101.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.2.3",
    "redis>=5.3.1",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
mypy_path = ["../sdk"]
